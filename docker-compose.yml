# Local PostgreSQL for development. Usage: docker compose up -d
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: paisa
      POSTGRES_PASSWORD: paisa_dev
      POSTGRES_DB: paisa_dev
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./scripts/init-test-db.sql:/docker-entrypoint-initdb.d/init-test-db.sql:ro
volumes:
  pgdata:
